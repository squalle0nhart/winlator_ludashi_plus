name: Android CI Bionic

on:
  push:
    branches: [ "wfm-fix" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone linkernsbypass
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
          app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Clone libadrenotools specific commit
      run: |
        rm -rf app/src/main/cpp/adrenotools
        
        git clone https://github.com/Pipetto-crypto/libadrenotools.git \
          app/src/main/cpp/adrenotools

        cd app/src/main/cpp/adrenotools
        git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

    - name: Clone linkernsbypass inside adrenotools
      run: |
        mkdir -p app/src/main/cpp/adrenotools/lib
        
        git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
          app/src/main/cpp/adrenotools/lib/linkernsbypass

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Shader Compiler
      run: sudo apt-get update && sudo apt-get install -y glslang-tools

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Bionic Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
